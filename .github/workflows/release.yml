name: Release packages

# When a release is published (with its .deb attached), build the other package
# formats, attach them to the release and update the APT repository (gh-pages).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build RPM
        run: |
          dnf install -y rpm-build python3 gh
          V="${TAG#v}"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          # git is missing when checkout runs in this container: the tree has no .git
          tar --exclude=.git --transform "s,^\.,Anticitoyen-ROG-flare2-anime-matrix-$V," \
            -czf ~/rpmbuild/SOURCES/Anticitoyen-ROG-flare2-anime-matrix-$V.tar.gz .
          sed "s/@VERSION@/$V/" packaging/rpm/anticitoyen-rog-flare2-anime-matrix.spec > ~/rpmbuild/SPECS/animematrix.spec
          rpmbuild -bb ~/rpmbuild/SPECS/animematrix.spec
          gh release upload "$TAG" ~/rpmbuild/RPMS/noarch/*.rpm --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish to Copr
        continue-on-error: true
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then echo "COPR_CONFIG absent : publication Copr sautée"; exit 0; fi
          dnf install -y copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          rpmbuild -bs ~/rpmbuild/SPECS/animematrix.spec
          copr-cli build --nowait animematrix ~/rpmbuild/SRPMS/*.src.rpm

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build Arch package
        run: |
          pacman -Syu --noconfirm base-devel python github-cli git
          V="${TAG#v}"
          useradd -m builder
          mkdir /home/builder/pkg
          sed "s/@VERSION@/$V/" packaging/aur/PKGBUILD > /home/builder/pkg/PKGBUILD
          cp packaging/aur/animematrix.install /home/builder/pkg/
          chown -R builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && makepkg --nodeps --noconfirm"
          # somme de contrôle réelle de l'archive des sources (pour l'AUR), puis .SRCINFO
          SUM=$(sha256sum /home/builder/pkg/*-"$V".tar.gz | cut -d' ' -f1)
          sed -i "s/^sha256sums=('SKIP')/sha256sums=('$SUM')/" /home/builder/pkg/PKGBUILD
          su builder -c "cd /home/builder/pkg && makepkg --printsrcinfo > .SRCINFO"
          gh release upload "$TAG" /home/builder/pkg/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish to the AUR
        continue-on-error: true  # compte AUR pas encore créé : la release reste valable
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then echo "AUR_SSH_PRIVATE_KEY absent : publication AUR sautée"; exit 0; fi
          pacman -S --noconfirm --needed openssh
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/anticitoyen-rog-flare2-anime-matrix.git aur
          cp /home/builder/pkg/PKGBUILD /home/builder/pkg/.SRCINFO /home/builder/pkg/animematrix.install aur/
          cd aur
          git config user.name "AntiCitoyen"
          git config user.email "anticitoyen@users.noreply.gitlab.com"
          git add PKGBUILD .SRCINFO animematrix.install
          git commit -m "Update to ${TAG#v}" || exit 0
          git push origin HEAD:master

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build Flatpak bundle (Flathub manifest, without network)
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
          APP=io.github.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix
          sed -e 's#path: \.\./\.\.#path: .#' -e 's#^  - python3-modules.json#  - packaging/flathub/python3-modules.json#' \
            packaging/flathub/$APP.yml > $APP.yml
          flatpak-builder --user --force-clean --sandbox --repo=repo build $APP.yml
          flatpak build-bundle repo "AniMeMatrix-${TAG#v}.flatpak" $APP
          gh release upload "$TAG" AniMeMatrix-*.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  apt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Get the release .deb
        run: gh release download "$TAG" --pattern '*_all.deb' --dir dist --repo "$GITHUB_REPOSITORY"
      - name: Update the APT repository (gh-pages)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add pages origin/gh-pages
          else
            git worktree add --detach pages && (cd pages && git checkout --orphan gh-pages && git rm -rfq .)
          fi
          KEY=""
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
            KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          fi
          packaging/apt/publier-depot.sh pages dist/*_all.deb $KEY
          cp packaging/apt/index.html pages/index.html
          touch pages/.nojekyll
          cd pages
          git config user.name "AntiCitoyen"
          git config user.email "anticitoyen@users.noreply.gitlab.com"
          git add -A
          git commit -m "APT repository: $TAG" || exit 0
          git push origin HEAD:gh-pages
