name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick lintian libusb-1.0-0 libudev1 dbus python3-gi libglib2.0-bin

      - name: Python dependencies
        run: pip install pillow numpy hidapi pynput python-xlib pytest ruff

      - name: Lint (ruff)
        run: ruff check --select F,E9 --exclude polywollywin,rog_flare2_matrix_paint.py,parse_usbpcap.py .

      - name: Tests (virtual display, fake keyboard)
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests

      - name: Debian package
        run: |
          packaging/build-deb.sh
          lintian --fail-on error dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
