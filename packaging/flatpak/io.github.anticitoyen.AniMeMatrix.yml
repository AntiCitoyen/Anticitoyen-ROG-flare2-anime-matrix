app-id: io.github.anticitoyen.AniMeMatrix
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: animematrix
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network                     # mises à jour, bibliothèque d'animations
  - --device=all                        # accès HID/USB au clavier (règle udev installée sur l'hôte)
  - --filesystem=xdg-pictures           # galerie de GIF
  - --filesystem=xdg-download:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args: [--share=network]
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir hidapi pillow numpy python-xlib pynput
  - name: animematrix
    buildsystem: simple
    build-commands:
      - packaging/install.sh / /app /usr/bin/python3
      - install -Dm644 packaging/flatpak/io.github.anticitoyen.AniMeMatrix.metainfo.xml
        /app/share/metainfo/io.github.anticitoyen.AniMeMatrix.metainfo.xml
      - mv /app/share/applications/animematrix.desktop /app/share/applications/io.github.anticitoyen.AniMeMatrix.desktop
      - sed -i 's/^Icon=animematrix$/Icon=io.github.anticitoyen.AniMeMatrix/' /app/share/applications/io.github.anticitoyen.AniMeMatrix.desktop
      - mv /app/share/icons/hicolor/scalable/apps/animematrix.svg /app/share/icons/hicolor/scalable/apps/io.github.anticitoyen.AniMeMatrix.svg
    sources:
      - type: dir
        path: ../..
